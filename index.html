<!DOCTYPE html>
<html>
<head>
    <title>Neaia Interactive Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #0f141d;
        }
        /* Custom styling for markers/popups */
        .leaflet-popup-content-wrapper {
            background: #1e2638;
            color: #fff;
            border-radius: 8px;
        }
        .leaflet-popup-tip {
            background: #1e2638;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // 1. Dimensions of your SVG (Height: 5000px, Width: 10000px)
        const mapHeight = 5000;
        const mapWidth = 10000;
        const bounds = [[0, 0], [mapHeight, mapWidth]];

        // 2. Initialize Leaflet Map
        const map = L.map('map', {
            crs: L.CRS.Simple,
            maxZoom: 3,
            zoomSnap: 0.1,
            zoomDelta: 0.5,
            maxBounds: bounds,             // Keeps view inside the map
            maxBoundsViscosity: 1.0        // Hard boundary bounce-back
        });

        // 3. Add the SVG Overlay
        const mapOverlay = L.imageOverlay('Neaia Map.svg', bounds).addTo(map);

        // 4. Fit map to screen & dynamically lock the minimum zoom level
        map.fitBounds(bounds);
        const minFitZoom = map.getBoundsZoom(bounds);
        map.setMinZoom(minFitZoom);

        // Re-calculate minimum zoom if the browser window/chromebook is resized
        window.addEventListener('resize', () => {
            const updatedMinZoom = map.getBoundsZoom(bounds);
            map.setMinZoom(updatedMinZoom);
        });

        // 5. Example: Adding Interactive Markers
        // Format: [Y, X] -> [vertical_from_bottom, horizontal_from_left]
        const sampleMarker = L.circleMarker([2500, 5000], {
            radius: 8,
            color: '#00ff88',
            fillColor: '#00ff88',
            fillOpacity: 0.8
        }).addTo(map);

        sampleMarker.bindPopup("<b>Central Sea</b><br>Coordinates: [2500, 5000]");

        // 6. Helper: Click anywhere on map to log [Y, X] coordinates to browser console
        map.on('click', function(e) {
            console.log(`Clicked at: [${Math.round(e.latlng.lat)}, ${Math.round(e.latlng.lng)}]`);
        });
    </script>
</body>
</html>
