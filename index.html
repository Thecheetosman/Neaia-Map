<!DOCTYPE html>
<html>
<head>
    <title>Neaia Interactive Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -3,
            maxZoom: 3,
            zoomSnap: 0.25
        });

        // Replace 4000 and 2000 with your actual SVG width and height if different
        var bounds = [[0, 0], [5000, 10000]];
        L.imageOverlay('Neaia Map.svg', bounds).addTo(map);
        map.fitBounds(bounds);
    </script>
</body>
</html>
