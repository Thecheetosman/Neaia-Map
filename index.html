<!DOCTYPE html>
<html>
<head>
    <title>Neaia Interactive Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #0f141d;
        }
        /* Coordinate display box */
        .coord-box {
            background: rgba(15, 20, 29, 0.85);
            color: #00ff88;
            padding: 6px 12px;
            font-family: monospace;
            font-size: 13px;
            border-radius: 4px;
            border: 1px solid #303a4c;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // 1. Dimensions of your SVG map
        const mapHeight = 5000;
        const mapWidth = 10000;
        const mapBounds = [[0, 0], [mapHeight, mapWidth]];

        // 2. Allow padding around the edges so zoom-out doesn't get blocked
        // Padded by 20% on each side
        const viewBounds = [
            [-mapHeight * 0.2, -mapWidth * 0.2], 
            [mapHeight * 1.2, mapWidth * 1.2]
        ];

        // 3. Initialize Map
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -6,                   // Allows plenty of zoom-out room
            maxZoom: 4,
            zoomSnap: 0.1,
            zoomDelta: 0.5,
            maxBounds: viewBounds,         // Prevents panning to infinity, but allows seeing whole map
            maxBoundsViscosity: 0.7
        });

        // 4. Add the SVG Overlay
        const overlay = L.imageOverlay('Neaia Map.svg', mapBounds).addTo(map);

        // 5. Fit the entire map on screen smoothly
        map.fitBounds(mapBounds);

        // 6. Coordinate Tracker (shows exact [Y, X] in bottom-left corner)
        const coordControl = L.control({ position: 'bottomleft' });
        coordControl.onAdd = function() {
            const div = L.DomUtil.create('div', 'coord-box');
            div.innerHTML = 'Hover over map for [Y, X]';
            return div;
        };
        coordControl.addTo(map);

        map.on('mousemove', function(e) {
            const y = Math.round(e.latlng.lat);
            const x = Math.round(e.latlng.lng);
            document.querySelector('.coord-box').innerHTML = `Y: ${y}, X: ${x}`;
        });

        // Example Marker
        const marker = L.circleMarker([2500, 5000], {
            radius: 7,
            color: '#00ff88',
            fillColor: '#00ff88',
            fillOpacity: 0.9
        }).addTo(map);
        marker.bindPopup("<b>Center of Map</b><br>[2500, 5000]");
    </script>
</body>
</html>
